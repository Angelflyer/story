name: Update CERT feeds

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_feeds.py"
      - "docs/data/certs.json"
      - ".github/workflows/update-feeds.yml"

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch feeds
        run: python scripts/update_feeds.py
      - name: Commit changes
        run: |
          if git add -N docs/data/feeds.opml docs/data/history.json 2>/dev/null; git diff --quiet -- docs/data/latest.json docs/data/feeds.opml docs/data/history.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json docs/data/feeds.opml docs/data/history.json
          git commit -m "Update CERT feeds"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          echo "Could not push after 4 attempts." >&2
          exit 1
